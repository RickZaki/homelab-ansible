---
# configure_console_autologin.yml — Enable root autologin on LXC console.
#
# Usage:
#   ansible-playbook playbooks/configure_console_autologin.yml

- name: Configure console autologin
  hosts: pve99_containers:GitLab_runners
  become: false
  gather_facts: false

  vars:
    getty_dir: /etc/systemd/system/container-getty@.service.d

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      notify: Restart container-getty

    - name: Restart container-getty
      ansible.builtin.systemd:
        name: container-getty@2.service
        state: restarted

  tasks:
    - name: Create getty override directory
      ansible.builtin.file:
        path: "{{ getty_dir }}"
        state: directory
        mode: "0755"

    - name: Write autologin override
      ansible.builtin.copy:
        dest: "{{ getty_dir }}/autologin.conf"
        mode: "0644"
        content: |-
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty \
            --autologin root \
            --noclear \
            --keep-baud tty%I \
            115200,38400,9600 linux
      notify: Reload systemd daemon
