---
# configure_console_autologin.yml — Enable root autologin on LXC console.
#
# Usage:
#   ansible-playbook playbooks/configure_console_autologin.yml

- name: Configure console autologin
  hosts: pve99_containers:GitLab_runners
  become: false
  gather_facts: false

  tasks:
    - name: Create getty override directory
      ansible.builtin.file:
        path: /etc/systemd/system/container-getty@.service.d
        state: directory
        mode: "0755"

    - name: Write autologin override
      ansible.builtin.copy:
        dest: /etc/systemd/system/container-getty@.service.d/autologin.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud tty%I 115200,38400,9600 linux
      register: autologin_conf

    - name: Reload systemd and restart getty
      when: autologin_conf.changed
      block:
        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Restart container-getty@2
          ansible.builtin.systemd:
            name: container-getty@2.service
            state: restarted
