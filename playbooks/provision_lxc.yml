---
# provision_lxc.yml — Generic LXC provisioner.
#
# Provisions any LXC container from any community-scripts URL.
# All optional vars default in tasks/provision_lxc.yml; the community
# script's own defaults apply for anything not explicitly set.
#
# Required:
#   lxc_vmid        — Container ID (e.g. 110)
#   lxc_hostname    — Hostname inside the container
#
# Usage:
#   ansible-playbook playbooks/provision_lxc.yml \
#     -e lxc_vmid=110 \
#     -e lxc_hostname=mycontainer \
#     [-e "lxc_script_url=https://..."]  # defaults to debian.sh
#     [--limit pve01]

- name: Provision LXC container
  hosts: ProxmoxVirtualEnvironments
  become: true
  gather_facts: false

  tasks:
    - name: Provision LXC {{ lxc_vmid }} ({{ lxc_hostname }})
      ansible.builtin.import_tasks: ../tasks/provision_lxc.yml
