---
# configure_prometheus.yml — Full Prometheus setup: install, git, deploy key, clone config.
#
# Usage:
#   ansible-playbook playbooks/configure_prometheus.yml
#
# Prerequisites:
#   - LXC container created via Terraform
#   - Container running and reachable
#   - vault_gitlab_api_token set in vault

- name: Configure Prometheus
  hosts: prometheus
  become: false
  gather_facts: false

  vars:
    git_ssh_key_path: /root/.ssh/id_ed25519
    gitlab_host: gitlab.home.rickzaki.com
    gitlab_url: "https://{{ gitlab_host }}"
    gitlab_project_path: homelab/services/ops/prometheus-config
    gitlab_api_token: "{{ vault_gitlab_api_token }}"
    prometheus_config_repo: "git@{{ gitlab_host }}:{{ gitlab_project_path }}.git"

  vars_files:
    - ../inventory/group_vars/GitLab_runners/vault.yml

  roles:
    - role: prometheus

  tasks:
    # --- Git + SSH key ---
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate ed25519 SSH key pair
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ git_ssh_key_path }}
        -N "" -C "{{ inventory_hostname }}@ansible-deploy"
      args:
        creates: "{{ git_ssh_key_path }}"

    - name: Add GitLab host key to known_hosts
      ansible.builtin.shell: >
        ssh-keyscan -H {{ gitlab_host }} >> /root/.ssh/known_hosts 2>/dev/null
      args:
        creates: /root/.ssh/known_hosts

    # --- Register deploy key on GitLab ---
    - name: Read public key
      ansible.builtin.command: cat {{ git_ssh_key_path }}.pub
      register: deploy_key
      changed_when: false

    - name: Check if deploy key already exists on GitLab
      ansible.builtin.uri:
        url: "{{ gitlab_url }}/api/v4/projects/{{ gitlab_project_path | regex_replace('/', '%2F') }}/deploy_keys"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: 200
      register: existing_keys
      no_log: true

    - name: Add deploy key to GitLab repo
      ansible.builtin.uri:
        url: "{{ gitlab_url }}/api/v4/projects/{{ gitlab_project_path | regex_replace('/', '%2F') }}/deploy_keys"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: json
        body:
          title: "{{ inventory_hostname }} (ansible-deploy)"
          key: "{{ deploy_key.stdout }}"
          can_push: false
        status_code: 201
      when: deploy_key.stdout not in (existing_keys.json | map(attribute='key') | list)
      no_log: true

    # --- Clone config repo ---
    - name: Check if config dir is already a git repo
      ansible.builtin.stat:
        path: "{{ prometheus_config_dir }}/.git"
      register: config_git

    - name: Remove default prometheus config dir before cloning
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}"
        state: absent
      when: not config_git.stat.exists

    - name: Clone prometheus config repo
      ansible.builtin.git:
        repo: "{{ prometheus_config_repo }}"
        dest: "{{ prometheus_config_dir }}"
        version: main
        accept_hostkey: true
      notify: Restart prometheus
