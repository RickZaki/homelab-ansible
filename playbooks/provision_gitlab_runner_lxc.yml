---
# provision_gitlab_runner_lxc.yml — Create one Debian LXC per GitLab Runner host.
#
# Targets GitLab_runners and delegates all PVE-side provisioning to pve_node,
# so a single --limit gitlab-runner-XX covers the full setup flow.
#
# Container spec per node:
#   VMID    : 133711{node_id}           (e.g. 13371101 on pve01, 13371182 on pve82)
#   Hostname: gitlab-runner-{node_id}   (e.g. gitlab-runner-01)
#   VLAN    : 599
#   Disks   : 8 GB root  +  8 GB mp0 → /var/lib/docker
#   Features: nesting=1  (required for Docker-in-LXC)
#   Type    : unprivileged
#
# Usage:
#   ansible-playbook playbooks/provision_gitlab_runner_lxc.yml --limit gitlab-runner-82

- name: Provision GitLab Runner LXC on each PVE node
  hosts: GitLab_runners
  become: true
  gather_facts: false

  vars:
    lxc_vmid: "{{ '133711' ~ node_id }}"
    lxc_hostname: "gitlab-runner-{{ node_id }}"
    lxc_cores: 1
    lxc_memory: 512
    lxc_root_size: 8
    lxc_bridge: vmbr1
    lxc_vlan: "599"
    lxc_storage: local-zfs
    lxc_script_url: "https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/ct/debian.sh"
    lxc_features: "nesting=1"
    lxc_autologin: true
    lxc_extra_mounts:
      - id: mp0
        size: 8
        path: /var/lib/docker

  roles:
    - role: lxc
