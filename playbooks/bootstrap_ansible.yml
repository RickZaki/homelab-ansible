---
# bootstrap_ansible.yml — Run ONCE with your personal SSH credentials to create the
# 'ansible' service account and install its public key on all hosts.
#
# Usage:
#   # SSH key (default)
#   ansible-playbook playbooks/bootstrap_ansible.yml --limit proxmox
#
#   # SSH password prompt
#   ansible-playbook playbooks/bootstrap_ansible.yml --limit proxmox --ask-pass
#
# After this playbook succeeds, all other playbooks run normally via ansible.cfg.


- name: Bootstrap ansible service account
  hosts: all
  become: true
  gather_facts: false

  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ""
    ansible_service_user: ansible
    ansible_service_group: ansible
    ansible_pubkey_content: "{{ ansible_pubkey_content }}"
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no"


  tasks:
    - name: Ensure python3, sudo, and bash are installed
      ansible.builtin.raw: sh -c 'if command -v apt-get >/dev/null 2>&1; then apt-get update -qq 2>/dev/null; apt-get install -y python3 sudo bash; elif command -v apk >/dev/null 2>&1; then apk add --no-cache python3 sudo bash openssh; fi'
      changed_when: false

    - name: Ensure ansible group exists
      ansible.builtin.group:
        name: "{{ ansible_service_group }}"
        system: true
        state: present

    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: "{{ ansible_service_user }}"
        group: "{{ ansible_service_group }}"
        shell: /bin/bash
        home: "/home/{{ ansible_service_user }}"
        create_home: true
        system: true
        password: "*"
        state: present

    - name: Grant passwordless sudo to ansible user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_service_user }}"
        content: "{{ ansible_service_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"

    - name: Ensure .ssh directory exists for ansible user
      ansible.builtin.file:
        path: "/home/{{ ansible_service_user }}/.ssh"
        state: directory
        owner: "{{ ansible_service_user }}"
        group: "{{ ansible_service_group }}"
        mode: "0700"

    - name: Install ansible SSH public key
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_service_user }}/.ssh/authorized_keys"
        line: "{{ ansible_pubkey_content }}"
        create: true
        owner: "{{ ansible_service_user }}"
        group: "{{ ansible_service_group }}"
        mode: "0600"
