---
# configure_grafana.yml — Install Grafana, configure OIDC with Authentik,
# and deploy config from Git.
#
# Authentik prerequisites:
#   1. Create an OAuth2/OpenID Connect provider with:
#      - Redirect URI: <grafana_root_url>/login/generic_oauth
#      - Logout URI:   <grafana_root_url>/logout
#      - Logout Method: Front-channel
#      - Scopes:       authentik default OAuth Mapping: Application Entitlements
#   2. Create application entitlements: "Grafana Admins", "Grafana Editors"
#   3. Note the Client ID and Client Secret -> store in vault
#
# Prerequisites:
#   - LXC container created via Terraform
#   - Container running and reachable
#   - vault_gitlab_api_token set in vault
#
# Usage:
#   ansible-playbook playbooks/configure_grafana.yml

- name: Read datasource connection details
  hosts: influx-siem:prometheus
  become: false
  gather_facts: false

  tasks:
    - name: Load InfluxDB defaults
      ansible.builtin.include_vars:
        file: ../roles/influxdb/defaults/main.yml
      when: inventory_hostname == 'influx-siem'

    - name: Read Grafana reader token
      ansible.builtin.command:
        cmd: cat /root/.influxdb_grafana_token
      register: influxdb_grafana_token_file
      changed_when: false
      when: inventory_hostname == 'influx-siem'

    - name: Set InfluxDB connection facts
      ansible.builtin.set_fact:
        influxdb_grafana_token: "{{ influxdb_grafana_token_file.stdout }}"
        influxdb_url: "{{ influxdb_url }}"
        influxdb_org: "{{ influxdb_org }}"
        influxdb_bucket: "{{ influxdb_bucket }}"
      when: inventory_hostname == 'influx-siem'

    - name: Load Prometheus defaults
      ansible.builtin.include_vars:
        file: ../roles/prometheus/defaults/main.yml
      when: inventory_hostname == 'prometheus'

    - name: Set Prometheus connection facts
      ansible.builtin.set_fact:
        prometheus_url: "{{ prometheus_url }}"
      when: inventory_hostname == 'prometheus'

- name: Configure Grafana
  hosts: grafana
  become: false
  gather_facts: false

  vars:
    git_ssh_key_path: /root/.ssh/id_ed25519
    gitlab_host: gitlab.home.rickzaki.com
    gitlab_url: "https://{{ gitlab_host }}"
    gitlab_project_path: homelab/services/ops/grafana-config
    gitlab_api_token: "{{ vault_gitlab_api_token }}"
    # yamllint disable-line rule:line-length
    grafana_config_repo: "git@{{ gitlab_host }}:{{ gitlab_project_path }}.git"
    grafana_config_dir: /etc/grafana

  vars_files:
    - ../inventory/group_vars/GitLab_runners/vault.yml

  roles:
    - role: grafana

  tasks:
    # --- Git + SSH key ---
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate ed25519 SSH key pair
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ git_ssh_key_path }}
        -N "" -C "{{ inventory_hostname }}@ansible-deploy"
      args:
        creates: "{{ git_ssh_key_path }}"

    - name: Add GitLab host key to known_hosts
      ansible.builtin.shell: >
        ssh-keyscan -H {{ gitlab_host }} >> /root/.ssh/known_hosts 2>/dev/null
      args:
        creates: /root/.ssh/known_hosts

    # --- Register deploy key on GitLab ---
    - name: Read public key
      ansible.builtin.command: cat {{ git_ssh_key_path }}.pub
      register: deploy_key
      changed_when: false

    - name: Check if deploy key already exists on GitLab
      ansible.builtin.uri:
        # yamllint disable-line rule:line-length
        url: "{{ gitlab_url }}/api/v4/projects/{{ gitlab_project_path | regex_replace('/', '%2F') }}/deploy_keys"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: 200
      register: existing_keys
      no_log: true

    - name: Add deploy key to GitLab repo
      ansible.builtin.uri:
        # yamllint disable-line rule:line-length
        url: "{{ gitlab_url }}/api/v4/projects/{{ gitlab_project_path | regex_replace('/', '%2F') }}/deploy_keys"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: json
        body:
          title: "{{ inventory_hostname }} (ansible-deploy)"
          key: "{{ deploy_key.stdout }}"
          can_push: false
        status_code: 201
      # yamllint disable-line rule:line-length
      when: deploy_key.stdout not in (existing_keys.json | map(attribute='key') | list)
      no_log: true

    # --- Clone config repo ---
    - name: Set default git branch to main
      community.general.git_config:
        name: init.defaultBranch
        value: main
        scope: global

    - name: Check if config dir is already a git repo
      ansible.builtin.stat:
        path: "{{ grafana_config_dir }}/.git"
      register: config_git_dir

    - name: Remove default grafana config dir before cloning
      ansible.builtin.file:
        path: "{{ grafana_config_dir }}"
        state: absent
      when: not config_git_dir.stat.exists

    - name: Clone grafana config repo
      ansible.builtin.git:
        repo: "{{ grafana_config_repo }}"
        dest: "{{ grafana_config_dir }}"
        version: main
        accept_hostkey: true
      notify: Restart grafana

    - name: Write OIDC env file
      ansible.builtin.copy:
        dest: "{{ grafana_config_dir }}/oidc.env"
        content: "{{ grafana_oidc_env_content }}"
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart grafana

    - name: Write Prometheus datasource
      ansible.builtin.copy:
        dest: "{{ grafana_config_dir }}/provisioning/datasources/prometheus.yml"
        content: |
          ---
          apiVersion: 1

          datasources:
            - access: proxy
              editable: true
              isDefault: true
              name: Prometheus
              type: prometheus
              uid: prometheus
              url: {{ hostvars['prometheus']['prometheus_url'] }}
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart grafana

    - name: Write InfluxDB datasource with token
      vars:
        influx: "{{ hostvars['influx-siem'] }}"
      ansible.builtin.copy:
        dest: "{{ grafana_config_dir }}/provisioning/datasources/influxdb.yml"
        # yamllint disable rule:line-length
        content: |
          ---
          apiVersion: 1

          datasources:
            - access: proxy
              editable: true
              isDefault: false
              name: InfluxDB
              type: influxdb
              uid: influxdb
              url: {{ influx.influxdb_url }}
              jsonData:
                version: Flux
                organization: {{ influx.influxdb_org }}
                defaultBucket: {{ influx.influxdb_bucket }}
              secureJsonData:
                token: {{ influx.influxdb_grafana_token }}
        # yamllint enable rule:line-length
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart grafana

    # --- Start service (after config is in place) ---
    - name: Enable and start grafana-server
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started
        daemon_reload: true
