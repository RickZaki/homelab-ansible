---
# lxc_stop_restored.yml — Restore LXCs to stopped state.
#
# Usage:
#   ansible-playbook playbooks/lxc_stop_restored.yml

- name: Shut down LXCs that were started for updates
  hosts: "{{ lxc_target_hosts | default('all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Restore stopped LXCs
      ansible.builtin.include_tasks: ../roles/lxc/tasks/stop_restored.yml
