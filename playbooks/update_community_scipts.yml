---
# lxc_app_update.yml — Run Proxmox Helper Scripts 'update' on updateable LXCs.
#
# Usage:
#   ansible-playbook playbooks/lxc_app_update.yml
#

- name: Run PHS app update on LXCs
  hosts: communityScriptUpdate_capable
  become: true
  gather_facts: false

  tasks:
    - name: Start stopped LXCs
      ansible.builtin.import_tasks: ../tasks/lxc_start_stopped.yml

    - name: Update app
      ansible.builtin.import_tasks: ../tasks/community_scripts_update.yml

    - name: Stop restored LXCs
      ansible.builtin.import_tasks: ../tasks/lxc_stop_restored.yml
