---
# tasks/provision_lxc.yml
# Shared task file — provision or reconcile any Proxmox LXC container from a
# community-scripts URL.  Import this from a playbook that has already set the
# required and optional variables listed below.
#
# Required vars:
#   lxc_vmid         — Container ID string (e.g. "13371101")
#   lxc_hostname     — Hostname inside the container
#
# Optional vars — omit to let the community script use its own defaults.
#   Set explicitly only to override:
#   lxc_script_url       — community script URL (default: debian.sh)
#   lxc_cores            — CPU cores
#   lxc_memory           — RAM in MB
#   lxc_root_size        — root disk in GB
#   lxc_bridge           — network bridge  (e.g. vmbr0)
#   lxc_vlan             — VLAN tag        (empty string = remove tag)
#   lxc_dns              — DNS nameserver  (empty = inherit PVE node DNS)
#   lxc_storage          — storage pool    (e.g. local-zfs); required when
#                          adding new extra mounts to an existing container
#   lxc_features         —                 e.g. "nesting=1"
#   lxc_autologin        — auto-login root on tty1  (default true, CREATE only)
#   lxc_extra_mounts     — list of {id, size, path}
#                          e.g. [{id: mp0, size: 8, path: /var/lib/docker}]
#                          Mounts present on the container but absent from this
#                          list will be detached (storage volume preserved).

# ------------------------------------------------------------------ #
# Defaults                                                             #
# ------------------------------------------------------------------ #

- name: Default lxc_script_url to Debian community script
  ansible.builtin.set_fact:
    lxc_script_url: "{{ lxc_script_url | default('https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/ct/debian.sh') }}"

# ------------------------------------------------------------------ #
# Check existing state                                                 #
# ------------------------------------------------------------------ #

- name: Check if container {{ lxc_vmid }} already exists
  ansible.builtin.command: pct status {{ lxc_vmid }}
  register: pct_status
  changed_when: false
  failed_when: false

# ------------------------------------------------------------------ #
# CREATE — container does not exist                                    #
# ------------------------------------------------------------------ #

- name: Create container {{ lxc_vmid }} via community script
  when: pct_status.rc != 0
  block:
    - name: Install whiptail wrapper
      ansible.builtin.import_tasks: silent_whiptail_install.yml

    - name: Run community script ({{ lxc_script_url | basename }})
      ansible.builtin.shell: |
        export PATH="/tmp/silent-pve:$PATH"
        timeout 300 bash -c "$(curl -fsSL {{ lxc_script_url }})" < /dev/null
      register: community_script
      # rc 0   = clean exit
      # rc 124 = timeout — container already created, in-container apt phase
      #          hung waiting for network; safe to continue
      failed_when: community_script.rc not in [0, 124]
      args:
        executable: /bin/bash
      environment:
        TERM: xterm-256color
        var_ctid: "{{ lxc_vmid }}"
        var_hostname: "{{ lxc_hostname }}"
        var_cpu: "{{ lxc_cores | default('') }}"
        var_ram: "{{ lxc_memory | default('') }}"
        var_disk: "{{ lxc_root_size | default('') }}"
        var_brg: "{{ lxc_bridge | default('') }}"
        var_vlan: "{{ lxc_vlan | default('') }}"
        var_dns: "{{ lxc_dns | default('') }}"
        var_container_storage: "{{ lxc_storage | default('') }}"
        var_template_storage: "local"

  always:
    - name: Remove whiptail wrapper
      ansible.builtin.import_tasks: silent_whiptail_remove.yml

- name: Verify container was created successfully
  ansible.builtin.command: /usr/sbin/pct status {{ lxc_vmid }}
  register: pct_verify
  changed_when: false
  failed_when: pct_verify.rc != 0
  when: pct_status.rc != 0

- name: Stop container to safely apply post-create settings
  ansible.builtin.command: pct stop {{ lxc_vmid }}
  register: pct_stop
  failed_when: pct_stop.rc != 0 and 'not running' not in pct_stop.stderr
  when: pct_status.rc != 0

- name: Set container features ({{ lxc_features | default('') }})
  ansible.builtin.command: pct set {{ lxc_vmid }} --features {{ lxc_features }}
  when:
    - pct_status.rc != 0
    - lxc_features | default('') | length > 0

- name: Add extra mount {{ item.id | default('') }} → {{ item.path | default('') }} ({{ item.size | default('') }} GB)
  ansible.builtin.command: >
    pct set {{ lxc_vmid }}
    --{{ item.id }} {{ lxc_storage }}:{{ item.size }},mp={{ item.path }}
  loop: "{{ lxc_extra_mounts | default([]) }}"
  when: pct_status.rc != 0

- name: Start container {{ lxc_vmid }}
  ansible.builtin.command: pct start {{ lxc_vmid }}
  when: pct_status.rc != 0

# ------------------------------------------------------------------ #
# UPDATE — container exists, reconcile resources                       #
# ------------------------------------------------------------------ #

- name: Read current container config
  ansible.builtin.command: pct config {{ lxc_vmid }}
  register: pct_config
  changed_when: false
  when: pct_status.rc == 0

- name: Parse current container config values
  ansible.builtin.set_fact:
    current_cores:       "{{ (pct_config.stdout | regex_search('(?m)^cores: (\\d+)',     '\\1') or ['0']) | first | int }}"
    current_memory:      "{{ (pct_config.stdout | regex_search('(?m)^memory: (\\d+)',    '\\1') or ['0']) | first | int }}"
    current_rootfs_size: "{{ (pct_config.stdout | regex_search('rootfs:.*size=(\\d+)G', '\\1') or ['0']) | first | int }}"
    current_bridge:      "{{ (pct_config.stdout | regex_search('bridge=([^,\\n]+)',      '\\1') or [''])  | first }}"
    current_vlan:        "{{ (pct_config.stdout | regex_search('tag=([^,\\n]+)',          '\\1') or [''])  | first }}"
    current_dns:         "{{ (pct_config.stdout | regex_search('(?m)^nameserver: (.+)',  '\\1') or [''])  | first }}"
  when: pct_status.rc == 0

- name: Update cores if changed
  ansible.builtin.command: pct set {{ lxc_vmid }} --cores {{ lxc_cores }}
  when:
    - pct_status.rc == 0
    - lxc_cores is defined
    - current_cores | int != lxc_cores | int

- name: Update memory if changed
  ansible.builtin.command: pct set {{ lxc_vmid }} --memory {{ lxc_memory }}
  when:
    - pct_status.rc == 0
    - lxc_memory is defined
    - current_memory | int != lxc_memory | int

- name: Grow rootfs if smaller than desired ({{ lxc_root_size | default('') }} GB)
  ansible.builtin.command: pct resize {{ lxc_vmid }} rootfs {{ lxc_root_size }}G
  when:
    - pct_status.rc == 0
    - lxc_root_size is defined
    - current_rootfs_size | int < lxc_root_size | int

- name: Add missing extra mount {{ item.id | default('') }} → {{ item.path | default('') }} ({{ item.size | default('') }} GB)
  ansible.builtin.command: >
    pct set {{ lxc_vmid }}
    --{{ item.id }} {{ lxc_storage }}:{{ item.size }},mp={{ item.path }}
  loop: "{{ lxc_extra_mounts | default([]) }}"
  when:
    - pct_status.rc == 0
    - lxc_storage is defined
    - (pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int == 0

- name: Grow extra mount {{ item.id | default('') }} if smaller than desired ({{ item.size | default('') }} GB)
  ansible.builtin.command: pct resize {{ lxc_vmid }} {{ item.id }} {{ item.size }}G
  loop: "{{ lxc_extra_mounts | default([]) }}"
  when:
    - pct_status.rc == 0
    - (pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int > 0
    - (pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int < item.size | int

- name: Find stale extra mounts (in config but absent from lxc_extra_mounts)
  ansible.builtin.set_fact:
    mounts_to_remove: >-
      {{ pct_config.stdout
         | regex_findall('(?m)^(mp\d+):')
         | difference(lxc_extra_mounts | default([]) | map(attribute='id') | list) }}
  when: pct_status.rc == 0

- name: Stop container to remove stale mounts
  ansible.builtin.command: pct stop {{ lxc_vmid }}
  register: pct_stop_for_remove
  failed_when: pct_stop_for_remove.rc != 0 and 'not running' not in pct_stop_for_remove.stderr
  when:
    - pct_status.rc == 0
    - mounts_to_remove | default([]) | length > 0

- name: Remove stale extra mount {{ item | default('') }} (storage volume preserved)
  ansible.builtin.command: pct set {{ lxc_vmid }} --delete {{ item }}
  loop: "{{ mounts_to_remove | default([]) }}"
  when:
    - pct_status.rc == 0
    - mounts_to_remove | default([]) | length > 0

- name: Start container after stale mount removal
  ansible.builtin.command: pct start {{ lxc_vmid }}
  when:
    - pct_status.rc == 0
    - mounts_to_remove | default([]) | length > 0

- name: Update network bridge if changed
  ansible.builtin.shell: |
    current=$(pct config {{ lxc_vmid }} | grep '^net0:' | sed 's/^net0: //')
    pct set {{ lxc_vmid }} --net0 "$(echo "$current" | sed "s/bridge=[^,]*/bridge=$DESIRED_BRIDGE/")"
  environment:
    DESIRED_BRIDGE: "{{ lxc_bridge }}"
  when:
    - pct_status.rc == 0
    - lxc_bridge is defined
    - current_bridge != lxc_bridge
  changed_when: true

- name: Update network VLAN tag if changed
  ansible.builtin.shell: |
    current=$(pct config {{ lxc_vmid }} | grep '^net0:' | sed 's/^net0: //')
    if [ -n "$DESIRED_VLAN" ]; then
      if echo "$current" | grep -q 'tag='; then
        new=$(echo "$current" | sed "s/tag=[^,]*/tag=$DESIRED_VLAN/")
      else
        new="${current},tag=$DESIRED_VLAN"
      fi
    else
      # remove tag entirely
      new=$(echo "$current" | sed 's/,tag=[^,]*//' | sed 's/tag=[^,]*,//')
    fi
    pct set {{ lxc_vmid }} --net0 "$new"
  environment:
    DESIRED_VLAN: "{{ lxc_vlan | default('') }}"
  when:
    - pct_status.rc == 0
    - lxc_vlan is defined
    - current_vlan != (lxc_vlan | string)
  changed_when: true

- name: Update DNS nameserver if changed
  ansible.builtin.command: pct set {{ lxc_vmid }} --nameserver {{ lxc_dns }}
  when:
    - pct_status.rc == 0
    - lxc_dns is defined
    - current_dns != lxc_dns

- name: Ensure container features are set ({{ lxc_features | default('') }})
  ansible.builtin.command: pct set {{ lxc_vmid }} --features {{ lxc_features }}
  when:
    - pct_status.rc == 0
    - lxc_features | default('') | length > 0
    - lxc_features not in (pct_config.stdout | default(''))

# ------------------------------------------------------------------ #
# Verify — CREATE only                                                 #
# ------------------------------------------------------------------ #

- name: Wait for container to accept commands (up to 60 s)
  ansible.builtin.command: pct exec {{ lxc_vmid }} -- hostname
  register: ct_hostname_check
  retries: 12
  delay: 5
  until: ct_hostname_check.rc == 0
  changed_when: false
  when: pct_status.rc != 0

- name: Confirm container is up
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: container {{ lxc_vmid }}
      is running — hostname={{ ct_hostname_check.stdout }}
  when: pct_status.rc != 0

# ------------------------------------------------------------------ #
# Configure — autologin on tty1 (CREATE only)                         #
# Uses a systemd drop-in so it survives getty package upgrades.        #
# pct push avoids shell-escaping issues writing file content via exec. #
# ------------------------------------------------------------------ #

- name: Write autologin drop-in to temp file on PVE host
  ansible.builtin.copy:
    dest: /tmp/lxc-autologin-{{ lxc_vmid }}.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
    mode: "0644"
  when:
    - pct_status.rc != 0
    - lxc_autologin | default(true) | bool

- name: Create drop-in directory inside container
  ansible.builtin.command: >
    pct exec {{ lxc_vmid }} --
    mkdir -p /etc/systemd/system/getty@tty1.service.d
  changed_when: false
  when:
    - pct_status.rc != 0
    - lxc_autologin | default(true) | bool

- name: Push autologin drop-in into container
  ansible.builtin.command: >
    pct push {{ lxc_vmid }}
    /tmp/lxc-autologin-{{ lxc_vmid }}.conf
    /etc/systemd/system/getty@tty1.service.d/autologin.conf
    --perms 0644
  when:
    - pct_status.rc != 0
    - lxc_autologin | default(true) | bool

- name: Reload systemd inside container
  ansible.builtin.command: pct exec {{ lxc_vmid }} -- systemctl daemon-reload
  changed_when: false
  when:
    - pct_status.rc != 0
    - lxc_autologin | default(true) | bool

- name: Remove temp autologin file from PVE host
  ansible.builtin.file:
    path: /tmp/lxc-autologin-{{ lxc_vmid }}.conf
    state: absent
  when:
    - pct_status.rc != 0
    - lxc_autologin | default(true) | bool
