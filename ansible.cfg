[defaults]
host_key_checking   = False
inventory           = inventory/
private_key_file    = ./.ssh/ansible.pem
remote_tmp          = /tmp/.ansible/tmp
remote_user         = ansible
retry_files_enabled = False
roles_path          = ./roles
vault_password_file = .vault_pass

# SSH connection settings
[ssh_connection]
pipelining          = True
