---
# roles/lxc/tasks/delete.yml
# Stop and destroy an LXC container. Destructive and irreversible.

- name: Check LXC status
  ansible.builtin.command: /usr/sbin/pct status {{ proxmox_vmid }}
  delegate_to: "{{ pve_node }}"
  become: true
  register: lxc_status
  changed_when: false
  failed_when: false

- name: Stop LXC if running
  ansible.builtin.command: /usr/sbin/pct stop {{ proxmox_vmid }}
  delegate_to: "{{ pve_node }}"
  become: true
  when: "'running' in lxc_status.stdout"

- name: Destroy LXC
  ansible.builtin.command: /usr/sbin/pct destroy {{ proxmox_vmid }} --purge
  delegate_to: "{{ pve_node }}"
  become: true
  when: lxc_status.rc == 0
