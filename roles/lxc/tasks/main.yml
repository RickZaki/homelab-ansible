---
# roles/lxc/tasks/main.yml
# Provision or reconcile any Proxmox LXC container from a community-scripts URL.
#
# All tasks delegate to {{ pve_node }} automatically.
#
# Required vars:
#   lxc_vmid         — Container ID string (e.g. "13371101")
#   lxc_hostname     — Hostname inside the container
#   pve_node         — Inventory name of the PVE host to delegate to
#
# Optional vars — omit to let the community script use its own defaults:
#   lxc_script_url       — community script URL (default: debian.sh)
#   lxc_cores            — CPU cores
#   lxc_memory           — RAM in MB
#   lxc_root_size        — root disk in GB
#   lxc_bridge           — network bridge  (e.g. vmbr0)
#   lxc_vlan             — VLAN tag        (empty string = remove tag)
# yamllint disable-line rule:line-length
#   lxc_mac              — NIC MAC address (e.g. "BC:24:11:AA:BB:CC"; omit = auto)
#   lxc_dns              — DNS nameserver  (empty = inherit PVE node DNS)
#   lxc_storage          — storage pool    (e.g. local-zfs)
#   lxc_features         — e.g. "nesting=1"
# yamllint disable-line rule:line-length
#   lxc_autologin        — auto-login root on tty1  (default true, CREATE only)
#   lxc_extra_mounts     — list of {id, size, path}

- name: Provision or reconcile LXC container
  delegate_to: "{{ pve_node }}"
  block:

    # ------------------------------------------------------------------ #
    # Defaults                                                             #
    # ------------------------------------------------------------------ #

    - name: Default lxc_script_url to Debian community script
      ansible.builtin.set_fact:
        # yamllint disable-line rule:line-length
        lxc_script_url: "{{ lxc_script_url | default('https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/ct/debian.sh') }}"

    # ------------------------------------------------------------------ #
    # Check existing state                                                 #
    # ------------------------------------------------------------------ #

    - name: Check if container already exists
      ansible.builtin.command: pct status {{ lxc_vmid }}
      register: lxc_pct_status
      changed_when: false
      failed_when: false

    # ------------------------------------------------------------------ #
    # CREATE — container does not exist                                    #
    # ------------------------------------------------------------------ #

    - name: Create container via community script
      when: lxc_pct_status.rc != 0
      block:
        - name: Create whiptail wrapper directory
          ansible.builtin.file:
            path: /tmp/silent-pve
            state: directory
            mode: "0755"

        - name: Install minimal whiptail wrapper
          ansible.builtin.copy:
            src: silent-whiptail
            dest: /tmp/silent-pve/whiptail
            mode: "0755"

        - name: Run community script ({{ lxc_script_url | basename }})
          ansible.builtin.shell: |
            export PATH="/tmp/silent-pve:$PATH"
            timeout 600 bash -c "$(curl -fsSL {{ lxc_script_url }})" < /dev/null
          register: lxc_community_script
          changed_when: true
          failed_when: lxc_community_script.rc not in [0, 124]
          args:
            executable: /bin/bash
          environment:
            TERM: xterm-256color
            var_ctid: "{{ lxc_vmid }}"
            var_hostname: "{{ lxc_hostname }}"
            var_cpu: "{{ lxc_cores | default('') }}"
            var_ram: "{{ lxc_memory | default('') }}"
            var_disk: "{{ lxc_root_size | default('') }}"
            var_brg: "{{ lxc_bridge | default('') }}"
            var_vlan: "{{ lxc_vlan | default('') }}"
            var_mac: "{{ lxc_mac | default('') }}"
            var_dns: "{{ lxc_dns | default('') }}"
            var_net: "dhcp"
            var_unattended: "yes"
            PHS_SILENT: "1"
            var_container_storage: "{{ lxc_storage | default('') }}"
            var_template_storage: "local"

        - name: Check container exists after community script
          ansible.builtin.command: pct status {{ lxc_vmid }}
          register: lxc_pct_post_create
          changed_when: false
          failed_when: false

        - name: Fail with community script output if container was not created
          ansible.builtin.fail:
            msg: |
              Container {{ lxc_vmid }} was not created.
              community script rc={{ lxc_community_script.rc }}
              Check whether var_ctid is still the correct
              env var name for {{ lxc_script_url | basename }}.
              Run 'pct list' on the PVE node to see if a
              container was created under a different VMID.
              --- stdout ---
              {{ lxc_community_script.stdout | default('(empty)') }}
              --- stderr ---
              {{ lxc_community_script.stderr | default('(empty)') }}
          when: lxc_pct_post_create.rc != 0

      always:
        - name: Remove whiptail wrapper
          ansible.builtin.file:
            path: /tmp/silent-pve
            state: absent

    - name: Verify container was created successfully
      ansible.builtin.command: /usr/sbin/pct status {{ lxc_vmid }}
      register: lxc_pct_verify
      changed_when: false
      failed_when: lxc_pct_verify.rc != 0
      when: lxc_pct_status.rc != 0

    - name: Stop container to safely apply post-create settings
      ansible.builtin.command: pct stop {{ lxc_vmid }}
      register: lxc_pct_stop
      changed_when: true
      failed_when: >-
        lxc_pct_stop.rc != 0 and
        'not running' not in lxc_pct_stop.stderr
      when: lxc_pct_status.rc != 0

    - name: Set container features
      ansible.builtin.command: >-
        pct set {{ lxc_vmid }}
        --features {{ lxc_features }}
      changed_when: true
      when:
        - lxc_pct_status.rc != 0
        - lxc_features | default('') | length > 0

    - name: Add extra mount
      ansible.builtin.command: >
        pct set {{ lxc_vmid }}
        --{{ item.id }} {{ lxc_storage }}:{{ item.size }},mp={{ item.path }}
      changed_when: true
      loop: "{{ lxc_extra_mounts | default([]) }}"
      when: lxc_pct_status.rc != 0

    - name: Start container {{ lxc_vmid }}
      ansible.builtin.command: pct start {{ lxc_vmid }}
      changed_when: true
      when: lxc_pct_status.rc != 0

    # ------------------------------------------------------------------ #
    # UPDATE — container exists, reconcile resources                       #
    # ------------------------------------------------------------------ #

    - name: Read current container config
      ansible.builtin.command: pct config {{ lxc_vmid }}
      register: lxc_pct_config
      changed_when: false
      when: lxc_pct_status.rc == 0

    - name: Parse current container config values
      # yamllint disable rule:line-length
      ansible.builtin.set_fact:
        lxc_current_cores: "{{ (lxc_pct_config.stdout | regex_search('(?m)^cores: (\\d+)', '\\1') or ['0']) | first | int }}"
        lxc_current_memory: "{{ (lxc_pct_config.stdout | regex_search('(?m)^memory: (\\d+)', '\\1') or ['0']) | first | int }}"
        lxc_current_rootfs_size: "{{ (lxc_pct_config.stdout | regex_search('rootfs:.*size=(\\d+)G', '\\1') or ['0']) | first | int }}"
        lxc_current_bridge: "{{ (lxc_pct_config.stdout | regex_search('bridge=([^,\\n]+)', '\\1') or ['']) | first }}"
        lxc_current_vlan: "{{ (lxc_pct_config.stdout | regex_search('tag=([^,\\n]+)', '\\1') or ['']) | first }}"
        lxc_current_mac: "{{ (lxc_pct_config.stdout | regex_search('hwaddr=([^,\\n]+)', '\\1') or ['']) | first }}"
        lxc_current_dns: "{{ (lxc_pct_config.stdout | regex_search('(?m)^nameserver: (.+)', '\\1') or ['']) | first }}"
      # yamllint enable rule:line-length
      when: lxc_pct_status.rc == 0

    - name: Update cores if changed
      ansible.builtin.command: pct set {{ lxc_vmid }} --cores {{ lxc_cores }}
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_cores is defined
        - lxc_current_cores | int != lxc_cores | int

    - name: Update memory if changed
      ansible.builtin.command: pct set {{ lxc_vmid }} --memory {{ lxc_memory }}
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_memory is defined
        - lxc_current_memory | int != lxc_memory | int

    - name: Grow rootfs if smaller than desired
      ansible.builtin.command: >-
        pct resize {{ lxc_vmid }}
        rootfs {{ lxc_root_size }}G
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_root_size is defined
        - lxc_current_rootfs_size | int < lxc_root_size | int

    - name: Add missing extra mount
      ansible.builtin.command: >
        pct set {{ lxc_vmid }}
        --{{ item.id }} {{ lxc_storage }}:{{ item.size }},mp={{ item.path }}
      changed_when: true
      loop: "{{ lxc_extra_mounts | default([]) }}"
      when:
        - lxc_pct_status.rc == 0
        - lxc_storage is defined
        # yamllint disable-line rule:line-length
        - (lxc_pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int == 0

    - name: Grow extra mount if smaller than desired
      ansible.builtin.command: >-
        pct resize {{ lxc_vmid }}
        {{ item.id }} {{ item.size }}G
      changed_when: true
      loop: "{{ lxc_extra_mounts | default([]) }}"
      when:
        - lxc_pct_status.rc == 0
        # yamllint disable-line rule:line-length
        - (lxc_pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int > 0
        # yamllint disable-line rule:line-length
        - (lxc_pct_config.stdout | regex_search(item.id ~ ':.*size=(\\d+)G', '\\1') or ['0']) | first | int < item.size | int

    - name: Find stale extra mounts (in config but absent from lxc_extra_mounts)
      ansible.builtin.set_fact:
        lxc_mounts_to_remove: >-
          {{ lxc_pct_config.stdout
             | regex_findall('(?m)^(mp\d+):')
             | difference(lxc_extra_mounts
               | default([])
               | map(attribute='id') | list) }}
      when: lxc_pct_status.rc == 0

    - name: Stop container to remove stale mounts
      ansible.builtin.command: pct stop {{ lxc_vmid }}
      register: lxc_pct_stop_for_remove
      changed_when: true
      failed_when: >-
        lxc_pct_stop_for_remove.rc != 0 and
        'not running' not in lxc_pct_stop_for_remove.stderr
      when:
        - lxc_pct_status.rc == 0
        - lxc_mounts_to_remove | default([]) | length > 0

    - name: Remove stale extra mount (volume preserved)
      ansible.builtin.command: pct set {{ lxc_vmid }} --delete {{ item }}
      changed_when: true
      loop: "{{ lxc_mounts_to_remove | default([]) }}"
      when:
        - lxc_pct_status.rc == 0
        - lxc_mounts_to_remove | default([]) | length > 0

    - name: Start container after stale mount removal
      ansible.builtin.command: pct start {{ lxc_vmid }}
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_mounts_to_remove | default([]) | length > 0

    - name: Update network bridge if changed
      ansible.builtin.shell: |
        set -o pipefail
        current=$(pct config {{ lxc_vmid }} \
          | grep '^net0:' | sed 's/^net0: //')
        updated=$(echo "$current" \
          | sed "s/bridge=[^,]*/bridge=$DESIRED_BRIDGE/")
        pct set {{ lxc_vmid }} --net0 "$updated"
      environment:
        DESIRED_BRIDGE: "{{ lxc_bridge }}"
      when:
        - lxc_pct_status.rc == 0
        - lxc_bridge is defined
        - lxc_current_bridge != lxc_bridge
      changed_when: true

    - name: Update network VLAN tag if changed
      ansible.builtin.shell: |
        set -o pipefail
        current=$(pct config {{ lxc_vmid }} | grep '^net0:' | sed 's/^net0: //')
        if [ -n "$DESIRED_VLAN" ]; then
          if echo "$current" | grep -q 'tag='; then
            new=$(echo "$current" | sed "s/tag=[^,]*/tag=$DESIRED_VLAN/")
          else
            new="${current},tag=$DESIRED_VLAN"
          fi
        else
          # remove tag entirely
          new=$(echo "$current" | sed 's/,tag=[^,]*//' | sed 's/tag=[^,]*,//')
        fi
        pct set {{ lxc_vmid }} --net0 "$new"
      environment:
        DESIRED_VLAN: "{{ lxc_vlan | default('') }}"
      when:
        - lxc_pct_status.rc == 0
        - lxc_vlan is defined
        - lxc_current_vlan != (lxc_vlan | string)
      changed_when: true

    - name: Update network MAC address if changed
      ansible.builtin.shell: |
        set -o pipefail
        current=$(pct config {{ lxc_vmid }} | grep '^net0:' | sed 's/^net0: //')
        if echo "$current" | grep -q 'hwaddr='; then
          new=$(echo "$current" | sed "s/hwaddr=[^,]*/hwaddr=$DESIRED_MAC/")
        else
          new="${current},hwaddr=$DESIRED_MAC"
        fi
        pct set {{ lxc_vmid }} --net0 "$new"
      environment:
        DESIRED_MAC: "{{ lxc_mac }}"
      when:
        - lxc_pct_status.rc == 0
        - lxc_mac is defined
        - lxc_current_mac | upper != lxc_mac | upper
      changed_when: true

    - name: Update DNS nameserver if changed
      ansible.builtin.command: pct set {{ lxc_vmid }} --nameserver {{ lxc_dns }}
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_dns is defined
        - lxc_current_dns != lxc_dns

    - name: Ensure container features are set
      ansible.builtin.command: >-
        pct set {{ lxc_vmid }}
        --features {{ lxc_features }}
      changed_when: true
      when:
        - lxc_pct_status.rc == 0
        - lxc_features | default('') | length > 0
        - lxc_features not in (lxc_pct_config.stdout | default(''))

    # ------------------------------------------------------------------ #
    # Verify — CREATE only                                                 #
    # ------------------------------------------------------------------ #

    - name: Wait for container to accept commands (up to 60 s)
      ansible.builtin.command: pct exec {{ lxc_vmid }} -- hostname
      register: lxc_ct_hostname_check
      retries: 12
      delay: 5
      until: lxc_ct_hostname_check.rc == 0
      changed_when: false
      when: lxc_pct_status.rc != 0

    - name: Confirm container is up
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: container {{ lxc_vmid }}
          is running — hostname={{ lxc_ct_hostname_check.stdout }}
      when: lxc_pct_status.rc != 0

    # ------------------------------------------------------------------ #
    # Configure — autologin on tty1 (CREATE only)                         #
    # ------------------------------------------------------------------ #

    - name: Write autologin drop-in to temp file on PVE host
      ansible.builtin.copy:
        dest: /tmp/lxc-autologin-{{ lxc_vmid }}.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
        mode: "0644"
      when:
        - lxc_pct_status.rc != 0
        - lxc_autologin | default(true) | bool

    - name: Create drop-in directory inside container
      ansible.builtin.command: >
        pct exec {{ lxc_vmid }} --
        mkdir -p /etc/systemd/system/getty@tty1.service.d
      changed_when: false
      when:
        - lxc_pct_status.rc != 0
        - lxc_autologin | default(true) | bool

    - name: Push autologin drop-in into container
      ansible.builtin.command: >
        pct push {{ lxc_vmid }}
        /tmp/lxc-autologin-{{ lxc_vmid }}.conf
        /etc/systemd/system/getty@tty1.service.d/autologin.conf
        --perms 0644
      changed_when: true
      when:
        - lxc_pct_status.rc != 0
        - lxc_autologin | default(true) | bool

    - name: Reload systemd inside container
      ansible.builtin.command: >-
        pct exec {{ lxc_vmid }} --
        systemctl daemon-reload
      changed_when: false
      when:
        - lxc_pct_status.rc != 0
        - lxc_autologin | default(true) | bool

    - name: Remove temp autologin file from PVE host
      ansible.builtin.file:
        path: /tmp/lxc-autologin-{{ lxc_vmid }}.conf
        state: absent
      when:
        - lxc_pct_status.rc != 0
        - lxc_autologin | default(true) | bool
