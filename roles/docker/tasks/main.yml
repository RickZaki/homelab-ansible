---
# roles/docker/tasks/main.yml
# Install Docker CE from the official repository.
# Requires gather_facts: true for architecture and distribution detection.

- name: Set Docker architecture
  ansible.builtin.set_fact:
    docker_arch: >-
      {{ docker_arch_map[ansible_facts['architecture']]
         | default('amd64') }}

# ------------------------------------------------------------------ #
# Prerequisites                                                        #
# ------------------------------------------------------------------ #

- name: Install apt prerequisites for Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# ------------------------------------------------------------------ #
# Docker apt repository                                                #
# ------------------------------------------------------------------ #

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    architectures: "{{ docker_arch }}"
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: "{{ docker_apt_keyring }}"
    state: present

# ------------------------------------------------------------------ #
# Docker installation                                                  #
# ------------------------------------------------------------------ #

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Enable and start containerd service
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

# ------------------------------------------------------------------ #
# Verify /var/lib/docker mount                                         #
# ------------------------------------------------------------------ #

- name: Confirm /var/lib/docker is a separate mount point
  ansible.builtin.command: mountpoint -q /var/lib/docker
  register: docker_mountpoint
  changed_when: false
  failed_when: docker_mountpoint.rc != 0

- name: Report Docker data root
  ansible.builtin.command: >-
    docker info
    --format '{% raw %}{{.DockerRootDir}}{% endraw %}'
  register: docker_root
  changed_when: false

- name: Show Docker data root
  ansible.builtin.debug:
    msg: "Docker data root: {{ docker_root.stdout }}"

# ------------------------------------------------------------------ #
# Smoke test                                                           #
# ------------------------------------------------------------------ #

- name: Pull and run hello-world to verify Docker is functional
  ansible.builtin.command: docker run --rm hello-world
  register: docker_hello_world
  changed_when: false

- name: Show hello-world output
  ansible.builtin.debug:
    msg: "{{ docker_hello_world.stdout_lines }}"
