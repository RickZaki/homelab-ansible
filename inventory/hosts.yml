---
all:
  vars:
    ansible_python_interpreter: auto_silent

  children:
    ProxmoxVirtualEnvironments:
      vars:
        node_id: "{{ inventory_hostname | replace('pve', '') }}"
      # ansible_host must be a static string per host — NOT a template like
      # "{{ inventory_hostname }}.management.internal". When lxc_start_stopped.yml
      # delegates tasks to PVE hosts, Ansible evaluates the delegate's ansible_host
      # template using the *source* host's inventory_hostname (e.g. gitlab-runner-02),
      # producing the wrong hostname. Static values are immune to this scoping bug.
      hosts:
        pve01:
          ansible_host: pve01.management.internal
        pve02:
          ansible_host: pve02.management.internal
        pve82:
          ansible_host: pve82.management.internal
        pve99:
          ansible_host: pve99.management.internal

    ProxmoxBackupServers:
      hosts:
        ProxmoxBackupServer:
          ansible_host: ProxmoxBackupServer.storage.internal

    # Non-TF containers — these are not managed by Terraform (yet)
    pve01_containers:
      hosts:
        netRicks:
          proxmox_vmid: 1824
        netRicks-tools:
          proxmox_vmid: 1825

    ssh_capable:
      children:
        ProxmoxBackupServers:
        ProxmoxVirtualEnvironments:

    apt_capable:
      children:
        ProxmoxBackupServers:
        ProxmoxVirtualEnvironments:
        GitLab_runners:
        plex_servers:

    docker_capable:
      children:
        GitLab_runners:

    glances_capable:
      children:
        ProxmoxBackupServers:
        ProxmoxVirtualEnvironments:

    lxc_powered:
      children:
        pve01_containers:
        pve02_containers:
        pve82_containers:
        pve99_containers:

    plex_servers:
      hosts:
        netRicks:
        netRicks-tools:

    ubuntu_servers:
      children:
        plex_servers:
